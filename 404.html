<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Sylvain Utard</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #6f6f6f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #8f8f8f; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.65 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 640px; margin: 0 auto; padding: 96px 24px; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
    p { color: var(--muted); margin: 0; }
    a { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>Go back <a href="/">home</a>.</p>
  </main>
</body>
</html>
